[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*"]

[project]
name = "mlops-agent-assignment"
version = "0.1.0"
description = "A safe, evidence-based MLOps operations agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
live = [
  "dvc>=3.50,<4",
  "mlflow>=2.14,<4",
  "kubernetes>=30,<35",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

