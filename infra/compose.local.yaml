services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.7.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost,127.0.0.1,mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  airflow:
    build:
      context: ./airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW_HOME: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags:ro
      - ../training:/opt/airflow/training:ro
      - ../data:/opt/airflow/data
      - airflow-home:/opt/airflow

volumes:
  airflow-home:
  mlflow-data:
